name: attach-ipa

# 一次性把已编译好的未签名 IPA 拉进仓库；同时把执行回执提交回仓，便于无 API 情况下诊断
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  attach:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: attach ipa') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 下载安装包
        continue-on-error: true
        run: |
          set +e
          {
            echo "date: $(date -u)"
            echo "ref: ${{ github.ref }}  sha: ${{ github.sha }}"
            echo "---- curl ----"
            curl -fL --retry 3 --retry-delay 2 -o QuietSign-unsigned.ipa "https://aka.doubaocdn.com/s/yONE3F2V2b"
            echo "curl_exit=$?"
            echo "---- result ----"
            ls -l QuietSign-unsigned.ipa
            sha256sum QuietSign-unsigned.ipa
          } > ci-report.txt 2>&1
          cat ci-report.txt

      - name: 回执与入库
        if: always()
        run: |
          set +e
          {
            echo "---- git ----"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f ci-report.txt
            if [ -f QuietSign-unsigned.ipa ]; then git add -f QuietSign-unsigned.ipa; fi
            git status --short
            git commit -m "ci: attach ipa report"
            echo "commit_exit=$?"
            git push
            echo "push_exit=$?"
          } >> ci-report.txt 2>&1
          echo "== final report =="
          cat ci-report.txt
          git add -f ci-report.txt
          git commit --amend --no-edit || true
          git push || true
